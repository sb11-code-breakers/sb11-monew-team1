name: CI (Push)

on:
  push:
    branches: [dev, main]

permissions: {}

jobs:
  codecov:
    name: Upload coverage to Codecov
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find PR for this commit
        id: pr
        run: |
          PR_INFO=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] | {number: (.number // ""), sha: (.head.sha // "")}' \
            2>/dev/null || echo '{"number":"","sha":""}')
          echo "number=$(echo "$PR_INFO" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PR_INFO" | jq -r '.sha')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find PR CI run ID
        id: run
        if: steps.pr.outputs.sha != ''
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci-pr.yml/runs?head_sha=$PR_HEAD_SHA&status=completed" \
            --jq "[.workflow_runs[] | {id, created_at}] | sort_by(.created_at) | reverse | first | .id" \
            2>/dev/null || true)
          echo "id=${RUN_ID:-}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.sha }}

      - name: Download Jacoco report from PR CI
        id: download
        if: steps.run.outputs.id != '' && steps.run.outputs.id != 'null'
        continue-on-error: true
        run: |
          rm -rf /tmp/jacoco-report
          gh run download ${{ steps.run.outputs.id }} \
            --repo ${{ github.repository }} \
            --name jacoco-report \
            --dir /tmp/jacoco-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Jacoco XML path
        id: report
        if: steps.download.outcome == 'success'
        run: |
          REPORT_FILE=$(find /tmp/jacoco-report -type f -name 'jacocoTestReport.xml' | head -n 1)
          echo "file=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Upload to Codecov
        if: steps.report.outputs.file != ''
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.file }}
          fail_ci_if_error: true

      - name: Skip (no PR artifact found)
        if: >-
          steps.pr.outputs.sha == '' ||
          steps.run.outputs.id == '' ||
          steps.run.outputs.id == 'null' ||
          steps.download.outcome != 'success'
        run: echo "No PR artifact found — Codecov upload skipped"
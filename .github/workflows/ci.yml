name: CI

on:
  push:
    branches: [dev, main]
  pull_request_target:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  filter:
    name: Filter changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.f.outputs.src }}
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: f
        with:
          filters: |
            src:
              - '**/*.java'
              - '**/*.gradle'
              - 'src/**'

  test:
    name: Run tests
    needs: filter
    if: needs.filter.outputs.src == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read    # 코드 체크아웃
      id-token: write   # AWS OIDC 인증

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17 (Corretto)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download config files from S3
        run: |
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/test/application.yaml src/main/resources/application.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/test/application-test.yaml src/test/resources/application-test.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/.env .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests and check coverage gate (80%)
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/html/
          retention-days: 7

  skip:
    name: Skip CI
    needs: filter
    if: needs.filter.outputs.src != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: CI skipped
        run: echo "CI skipped — no code changes"

  result:
    name: CI Result
    needs: [test, skip]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            exit 1
          fi
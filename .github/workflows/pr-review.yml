name: PR Review & Discord Notification

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

permissions:
  pull-requests: write
  contents: read

jobs:
  discord-pr-notify:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ACTION="${{ github.event.action }}"
          if [[ "$ACTION" == "synchronize" ]]; then
            LABEL="🔄 PR 변경"
            COLOR=15105570
          else
            LABEL="📌 PR 등록"
            COLOR=3447003
          fi

          jq -n \
            --arg title "${LABEL} | ${{ github.event.pull_request.title }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg actor "${{ github.actor }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  {"name": "👤 작성자", "value": $actor, "inline": true},
                  {"name": "🎯 대상 브랜치", "value": $base, "inline": true}
                ],
                footer: {"text": "Code Breakers Bot"}
              }]
            }' \
          | curl -sS --fail --retry 3 --retry-delay 2 --max-time 15 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  claude-review:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      vars.CLAUDE_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          git fetch origin "$HEAD_SHA"

          if [[ "$PR_ACTION" == "synchronize" && -n "$BEFORE_SHA" ]]; then
            git fetch origin "$BEFORE_SHA"
            git diff "$BEFORE_SHA...$HEAD_SHA" > pr_diff.txt
            echo "synchronize diff: $BEFORE_SHA → $HEAD_SHA"
          else
            git diff "$BASE_SHA...$HEAD_SHA" > pr_diff.txt
            echo "full PR diff: $BASE_SHA → $HEAD_SHA"
          fi

          SIZE=$(wc -c < pr_diff.txt)
          if [[ "$SIZE" -gt 153600 ]]; then
            truncate -s 153600 pr_diff.txt
            echo "diff truncated: ${SIZE} → 153600 bytes"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
        run: python .github/scripts/claude_review.py

      - name: Send review completion embed
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ACTION="${{ github.event.action }}"
          LABEL=$([[ "$ACTION" == "synchronize" ]] && echo "재" || echo "초기")
          jq -n \
            --arg title "🔍 리뷰 완료 | PR #${{ github.event.pull_request.number }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg desc "${LABEL}리뷰 등록" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3066993,
                footer: {text: "Code Breakers Bot"}
              }]
            }' \
          | curl -sS --fail --retry 3 --retry-delay 2 --max-time 15 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

name: CD

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  id-token: write

jobs:
  # ════ Job 1: Build and push Docker image ══════════════════════
  build-and-push:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download config files from S3
        run: |
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/prod/application.yaml src/main/resources/application.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/prod/application-prod.yaml src/main/resources/application-prod.yaml

      - name: Login to Amazon ECR
        run: |
          REGISTRY=$(echo "${{ vars.ECR_REPOSITORY_URI }}" | awk -F'/' '{print $1}')
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin $REGISTRY

      - name: Build and push Docker image
        id: tag
        run: |
          IMAGE_URI=${{ vars.ECR_REPOSITORY_URI }}
          SHORT_SHA=${GITHUB_SHA::8}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="latest-${SHORT_SHA}"
          else
            TAG="staging-${SHORT_SHA}"
          fi
          docker build -t $IMAGE_URI:$TAG .
          docker push $IMAGE_URI:$TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "REPO_NAME=$(echo $IMAGE_URI | awk -F'/' '{print $NF}')" >> $GITHUB_ENV

      - name: Clean up old ECR images (keep latest 2)
        run: |
          TAG_PREFIX=$([ "${GITHUB_REF_NAME}" = "main" ] && echo "latest-" || echo "staging-")
          ALL_IMAGES=$(aws ecr describe-images \
            --repository-name $REPO_NAME \
            --region ${{ vars.AWS_REGION }} \
            --output json \
            | jq --arg prefix "$TAG_PREFIX" '
                [.imageDetails[]
                 | select(.imageTags != null and any(.imageTags[]; startswith($prefix)))
                 | {imageDigest, imagePushedAt}]
                | sort_by(.imagePushedAt)
                | map(.imageDigest)
              ')

          TOTAL=$(echo $ALL_IMAGES | jq 'length')
          DELETE_COUNT=$((TOTAL - 2))

          if [ $DELETE_COUNT -gt 0 ]; then
            IMAGE_IDS=$(echo $ALL_IMAGES | jq "[.[0:$DELETE_COUNT] | .[] | {imageDigest:.}]")
            aws ecr batch-delete-image \
              --repository-name $REPO_NAME \
              --region ${{ vars.AWS_REGION }} \
              --image-ids "$IMAGE_IDS"
          fi

  # ════ Job 2: Deploy to ECS ════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            | jq --arg IMAGE "${{ vars.ECR_REPOSITORY_URI }}:${{ needs.build-and-push.outputs.image_tag }}" \
              '.containerDefinitions[0].image = $IMAGE
               | del(.taskDefinitionArn, .revision, .status,
                     .requiresAttributes, .compatibilities,
                     .registeredAt, .registeredBy)' \
            > /tmp/task-definition.json

      - name: Deploy to ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@a310a830f5c14e583e35d84e4e1ec7dd177c3c9c # v2
        with:
          task-definition: /tmp/task-definition.json
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
